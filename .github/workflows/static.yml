# Static gates of the repository on every push to main and every pull request: the lint of the changed files and the gates that need
# neither the engine nor the owner's machine (tools/check.sh --all and the engine gates run on the dev machine: Godot, a real window,
# the user:// profile). Tool versions are pinned; the pins are listed in docs/UTILITIES_REPORT.md.
name: static
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install gdtoolkit==4.5.0 ruff==0.16.9 shellcheck-py==0.11.0.1 actionlint-py==1.7.12.25 pillow
      - run: python tools/lint_changed.py --demo
      - run: python tools/lint_changed.py --base "${BASE/#0000000000000000000000000000000000000000/e4bb4df}"
      - run: python tools/flow_check.py
      - run: python tools/scene_node_check.py
      - run: python tools/af5_check.py --demo && python tools/af5_check.py
