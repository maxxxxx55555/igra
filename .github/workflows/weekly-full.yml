name: weekly-full
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install gdtoolkit==4.5.0 ruff==0.16.9 shellcheck-py==0.11.0.1 actionlint-py==1.7.12.25 pillow numpy soundfile
      - name: "Install ffmpeg (required by the audio gates: tools/check.sh:445)"
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Import clean-checkout resources with Godot 4.7
        run: |
          archive="$RUNNER_TEMP/godot.zip"
          curl -fLsS --retry 3 -o "$archive" https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          engine="$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          bash tools/qa_sim/bootstrap_imports.sh "$engine"
          "$engine" --headless --path . --verbose --quit > "$RUNNER_TEMP/boot.log" 2>&1
          if grep -E 'ERROR:|Leaked instance:|ObjectDB.*leaked' "$RUNNER_TEMP/boot.log"; then exit 1; fi
      - name: Static battery
        id: static
        run: bash tools/check.sh --static --require-full-toolchain
      - name: Simulations
        id: sims
        if: always()
        run: |
          failed=""
          for sim in balance_sim achievements_sim daily_sim ngplus_table endings_sim puzzle_economy_sim lighting_stage_sim i18n_placeholder_fuzz privacy_audit store_answers listing_audit project_input_check settings_consumer_check title_check hardcoded_text_gate i18n_truth_gate drawcall_estimate; do
            python "tools/qa_sim/$sim.py" > "/tmp/$sim.out" 2>&1 || failed="$failed $sim"
          done
          python tools/qa_sim/difficulty_curve.py --check > /tmp/difficulty_curve.out 2>&1 || failed="$failed difficulty_curve"
          python tools/qa_sim/consistency_check.py --check > /tmp/consistency_check.out 2>&1 || failed="$failed consistency_check"
          python tools/qa_sim/save_migration_sim.py --static > /tmp/save_migration_sim.out 2>&1 || failed="$failed save_migration_sim"
          python tools/af5_check.py > /tmp/af5_check.out 2>&1 || failed="$failed af5_check"
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
          test -z "$failed"
      - name: Issue on a regression
        if: failure()
        run: |
          gh issue create --title "weekly-full: a gate regressed on main (run $GITHUB_RUN_ID)" \
            --body "The weekly run failed. Static battery: ${{ steps.static.outcome }}. Simulations: ${{ steps.sims.outcome }}, failed: ${{ steps.sims.outputs.failed }}. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
