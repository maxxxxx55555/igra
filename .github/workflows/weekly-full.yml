name: Weekly Full Suite & Sims
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  weekly-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: python -m pip install gdtoolkit==4.5.0 ruff==0.16.9 shellcheck-py==0.11.0.1 actionlint-py==1.7.12.25 pillow

      - name: Run Full Static Check Suite
        run: bash tools/check.sh --static

      - name: Run All Sims & Fuzzers
        run: |
          python3 -c "import glob, subprocess; sims = sorted(glob.glob('tools/qa_sim/*_sim.py') + ['tools/qa_sim/i18n_placeholder_fuzz.py']); [print('--> Running', s) or subprocess.run(['python3', s], check=True) for s in sims]"

      - name: Report Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Weekly Full Simulation Regression Detected",
              body: "The scheduled weekly full static check and QA simulation suite failed on main branch. Please inspect the workflow run logs."
            })
