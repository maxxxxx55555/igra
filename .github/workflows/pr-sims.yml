# The rules of the game, checked on every pull request without the engine: the lint of the changed files, the whole static battery of tools/check.sh, and each
# simulation of tools/qa_sim as a job of its own (so a red job names the sim). The gates that need Godot and a real window (tools/check.sh --all, the bot,
# the perf and audio probes, the play-through) run on the dev machine; the exact commands are in docs/RELEASE_RUNBOOK.md. Tool versions are the pins of static.yml.
name: pr-sims
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-sims-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: ${{ github.event.pull_request.base.sha || 'e4bb4df' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install gdtoolkit==4.5.0 ruff==0.16.9 shellcheck-py==0.11.0.1 actionlint-py==1.7.12.25 pillow numpy
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python tools/lint_changed.py --base "$BASE"
      - run: bash tools/check.sh --static
  sims:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sim:
          - balance_sim.py
          - achievements_sim.py
          - daily_sim.py
          - ngplus_table.py
          - endings_sim.py
          - puzzle_economy_sim.py
          - lighting_stage_sim.py
          - i18n_placeholder_fuzz.py
          - privacy_audit.py
          - store_answers.py
          - listing_audit.py
          - project_input_check.py
          - settings_consumer_check.py
          - title_check.py
          - hardcoded_text_gate.py
          - i18n_truth_gate.py
          - drawcall_estimate.py
          - difficulty_curve.py --check
          - consistency_check.py --check
          - save_migration_sim.py --static
          - branch_absorb_sim.py --check docs/ABSORB_PLAN.md
          - gemini_handoff.py --check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pillow numpy
      - run: python tools/qa_sim/${{ matrix.sim }}
