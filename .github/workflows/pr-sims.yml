name: PR Sims & Static Gates
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: python -m pip install gdtoolkit==4.5.0 ruff==0.16.9 shellcheck-py==0.11.0.1 actionlint-py==1.7.12.25 pillow

      - name: Run Static Checks
        run: bash tools/check.sh --static

      - name: Lint Changed Files
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          python tools/lint_changed.py --base "${BASE}" || python tools/lint_changed.py --demo

      - name: Run All QA Sims
        run: |
          python3 -c "import glob, subprocess; sims = sorted(glob.glob('tools/qa_sim/*_sim.py') + ['tools/qa_sim/i18n_placeholder_fuzz.py']); [print('--> Running', s) or subprocess.run(['python3', s], check=True) for s in sims]"
